          "@type": "Question",
          "name": "¿Qué hace un Notary Public aquí?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En Colorado, un Notary Public es un testigo en quien confía el estado. Reviso su identificación, lo veo firmar y me aseguro de que nadie lo esté presionando. No soy abogado y no puedo dar asesoría legal. Si usted conoce cómo funciona esta figura en México o en Latinoamérica, aquí es un trabajo mucho más limitado."

            "@type": "Answer",
            "text": "No. No soy abogado, y como Notary Public de Colorado no puedo dar asesoría legal, escoger documentos por usted ni decirle cómo llenar un formulario legal. Mi trabajo es confirmar quién es usted y ser testigo de su firma."
          }

          "name": "¿Hace copias certificadas? ¿Puede certificar que una persona está viva?",

            "text": "Sí hago copias certificadas ($15 por copia) de diplomas, pasaportes, identificaciones, actas de otros estados y documentos privados, siempre que vea el original. No puedo certificar actas de nacimiento, defunción, matrimonio o divorcio de Colorado, documentos que se obtienen de oficinas de Colorado, ni que una persona está viva (\"fe de vida\"). Vea qué puedo y no puedo certificar."

          "@type": "Question",

            "@type": "Answer",

            "@type": "Answer",
            "text": "Traduzco documentos del español al inglés y viceversa. Una traducción certificada incluye una Declaración Jurada firmada por mí como traductor, en la que certifico que soy competente en ambos idiomas y que la traducción es completa y exacta. Está preparada para cumplir los requisitos de USCIS y del DMV de Colorado; la decisión final es de la agencia que la recibe. No se requiere su presencia física para este servicio."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puede notarizar una carta de permiso de viaje para mi hijo/a?",

            "text": "Sí. Puedo notarizar las firmas de los padres o tutores en una carta de autorización de viaje para menores (comúnmente llamada permiso de viaje), que muchos países de América Latina exigen cuando un menor viaja solo o con un solo padre. También puedo preparar una traducción certificada al español o inglés si la necesita. Importante: notarizo firmas únicamente — no soy abogado, así que no puedo redactar el contenido de la carta ni indicarle qué requiere el país de destino. Traiga la carta ya escrita y sin firmar, más una identificación con foto vigente."

        },

          }

          }
        }
